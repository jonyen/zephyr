name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (MAJOR.MINOR.PATCH). Defaults to a patch bump of VERSION.'
        required: false
        type: string

# The repo default is read-only, so the version-bump push and the release both need this
# stated explicitly or they fail at the end of an otherwise successful build.
permissions:
  contents: write

# Two releases racing would fight over the version bump and the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes diff against the last tag, which shallow clones don't have.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            IFS='.' read -r MAJOR MINOR PATCH < VERSION
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      # The 66 book JSONs are not committed here — the ESV text is licensed for API
      # access rather than redistribution — and build-dmg.sh only fetches them at DMG
      # time, which is far too late: the search index is built from them and the app
      # target lists them as resources, so both steps below fail without them.
      #
      # Reads jonyen/esv-text over SSH with the same read-only deploy key the web
      # deploy uses. See web/README.md.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEXT_REPO_SSH_KEY }}
      - name: Fetch scripture text
        run: ./Scripts/fetch-text.sh

      # search_index.json is a 25MB generated artifact and is gitignored, so a fresh
      # checkout doesn't have it. The app target lists it as a resource, so without this
      # every build fails in CpResource. Pure stdlib — no pip install needed.
      - name: Generate search index
        run: python3 Scripts/build_search_index.py

      # A release that ships a failing build is worse than no release.
      #
      # pipefail matters here: GitHub runs steps under `bash -e`, which does NOT fail a
      # pipeline when an earlier stage dies. Without it, piping xcodebuild into tail takes
      # tail's exit status, and a failing suite reports success.
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild -project Zephyr.xcodeproj \
            -scheme Zephyr \
            -configuration Debug \
            test 2>&1 | tail -40

      - name: Generate release notes
        id: notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          Scripts/release-notes.sh "${{ steps.version.outputs.version }}" > /tmp/notes.md
          echo "Release notes:"
          cat /tmp/notes.md

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/build-dmg.sh

      # The app replaces its own bundle with this zip, so it has to be provably ours.
      # Verifying against the key parsed out of UpdateService.swift — rather than a copy
      # pasted here — means CI cannot publish an update the shipped app would reject.
      - name: Sign update payload
        id: sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::UPDATE_SIGNING_KEY secret is not set — cannot publish a signed update"
            exit 1
          fi
          # Every base64 Ed25519 key (32 bytes -> 43 chars + '=') in the trust list.
          PUBKEYS=$(sed -n '/updatePublicKeys = \[/,/^    \]/p' ESVBible/Services/UpdateService.swift \
                    | grep -oE '"[A-Za-z0-9+/]{43}="' | tr -d '"')
          if [ -z "$PUBKEYS" ]; then
            echo "::error::Could not read updatePublicKeys from UpdateService.swift"
            exit 1
          fi
          SIG=$(swift Scripts/sign-update.swift sign dist/Zephyr.app.zip)

          # The signature has to satisfy at least one key the shipped app trusts, or this
          # release would be rejected by every install that receives it.
          VERIFIED=""
          while read -r KEY; do
            [ -n "$KEY" ] || continue
            if swift Scripts/sign-update.swift verify dist/Zephyr.app.zip "$SIG" "$KEY" >/dev/null 2>&1; then
              VERIFIED="$KEY"
              break
            fi
          done <<< "$PUBKEYS"

          if [ -z "$VERIFIED" ]; then
            echo "::error::Signature verifies against none of the keys this build trusts."
            echo "::error::UPDATE_SIGNING_KEY and updatePublicKeys have diverged."
            exit 1
          fi
          echo "Signature verified against a trusted key ($(wc -l <<< "$PUBKEYS" | tr -d ' ') trusted)"
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"

      - name: Build update feed
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://jonyen.com/zephyr-updates"
          mkdir -p publish
          # Versioned filenames so keep_files leaves earlier releases downloadable.
          cp "dist/Zephyr.app.zip"      "publish/Zephyr-$VERSION.app.zip"
          cp "dist/Zephyr-$VERSION.dmg" "publish/Zephyr-$VERSION.dmg"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$(cat /tmp/notes.md)" \
            --arg zipURL "$BASE/Zephyr-$VERSION.app.zip" \
            --arg dmgURL "$BASE/Zephyr-$VERSION.dmg" \
            --arg signature "${{ steps.sign.outputs.signature }}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: $notes, zipURL: $zipURL, dmgURL: $dmgURL,
              signature: $signature, publishedAt: $publishedAt}' > publish/manifest.json
          cat publish/manifest.json

      - name: Apply version to tracked files
        run: Scripts/apply-version.sh "${{ steps.version.outputs.version }}"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION README.md Zephyr.xcodeproj/project.pbxproj
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      # Tags the version-bump commit, so the tag and the shipped VERSION agree.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            "dist/Zephyr-$VERSION.dmg" \
            "dist/Zephyr.app.zip" \
            --title "v$VERSION" \
            --notes-file /tmp/notes.md

      # Last, deliberately: this is what announces the new version to every installed copy.
      # If anything above failed, no update is offered. keep_files retains older releases,
      # and this directory is a sibling of public/zephyr because the web deploy publishes
      # that one with keep_files: false and would otherwise wipe the feed on its next run.
      - name: Publish update feed to jonyen.com
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: jonyen/jonyen-website
          publish_branch: main
          publish_dir: ./publish
          destination_dir: public/zephyr-updates
          keep_files: true
