name: Deploy web to jonyen.com/zephyr
on:
  push:
    branches: [main]
    # This repo is a monorepo: the macOS app lives at the root, the web app in web/.
    # Without this filter every Swift-only commit would rebuild and republish the web
    # app to jonyen-website. Keep this workflow's own path listed so changes to it
    # still trigger a run.
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # There is no lockfile at the repo root, so the npm cache has to be
          # pointed at the web app's.
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # The 66 book JSONs are not committed here — the ESV text is licensed for API
      # access rather than redistribution, so Scripts/fetch-text.sh pulls it in at
      # build time (see the repo root README). Vite copies web/public/data/ into dist
      # verbatim, so without this step the build succeeds with an empty data/ and
      # every chapter fetch on the deployed site 404s.
      #
      # It reads jonyen/esv-text over SSH using a read-only deploy key kept in
      # the TEXT_REPO_SSH_KEY secret; DEPLOY_TOKEN is scoped to jonyen-website and
      # cannot read that repo. See web/README.md.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TEXT_REPO_SSH_KEY }}
      - name: Fetch scripture text
        working-directory: .
        run: ./Scripts/fetch-text.sh
      - run: npm run build
      # A textless build still succeeds and still publishes, which is how the site
      # went dark once already. Fail here instead of deploying an empty reader.
      - name: Verify the build contains the scripture text
        run: |
          count=$(ls dist/data/*.json | wc -l | tr -d ' ')
          if [ "$count" -ne 69 ]; then
            echo "::error::dist/data has $count JSON files, expected 69 (66 books + red_letter_verses.json + paragraph_starts.json + headings.json)"
            exit 1
          fi
          echo "dist/data: $count JSON files"
      # jonyen.com is served by jonyen/jonyen-website — a CRA app whose own workflow
      # (build_type: workflow) publishes on every push to its main. CRA copies public/
      # verbatim into the build, so landing dist/ in public/zephyr/ makes the site's
      # next deploy serve it at jonyen.com/zephyr/ with no changes to that workflow.
      #
      # Requires the DEPLOY_TOKEN secret on THIS repo (jonyen/zephyr) — see web/README.md.
      # publish_dir is relative to the workspace root, not the job working-directory.
      - name: Publish into jonyen-website/public/zephyr
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: jonyen/jonyen-website
          publish_branch: main
          publish_dir: ./web/dist
          destination_dir: public/zephyr
